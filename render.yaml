services:
  - type: web
    name: koya-clinic-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: koya-clinic-db
          property: connectionString
      - key: API_KEY
        sync: false

databases:
  - name: koya-clinic-db
    plan: free
